[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-pipeline"
version = "0.1.0"
description = "Pipeline end-to-end di Machine Learning per il rilevamento di frodi nelle transazioni con carta di credito (Kaggle Fraud Detection Dataset)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Federico Calò", email = "fedcal01@gmail.com" }]
keywords = [
    "machine-learning",
    "fraud-detection",
    "imbalanced-classification",
    "scikit-learn",
    "credit-card",
    "tutorial",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.13,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "joblib>=1.4,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "jupytext>=1.16",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]
xgboost = [
    "xgboost>=2.1,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
fraud-train = "fraud_pipeline.pipeline:main_train"
fraud-predict = "fraud_pipeline.inference:main_predict"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
